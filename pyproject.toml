[project]
name = "cell"
version = "0.0.1"
description = "Cells: separating what a system computes from how it runs"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "flask>=3",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cell"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
